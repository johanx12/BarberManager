<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Servicio — BarberManager</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root { --gold: #C9A84C; --gold-light: #E8C96B; --gold-dim: rgba(201,168,76,0.12); --bg: #080808; --surface: #111111; --surface2: #1a1a1a; --text: #F0EAD6; --text-muted: #7a7060; --border: rgba(201,168,76,0.18); }
        body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; }
        .navbar { position: sticky; top: 0; z-index: 100; background: rgba(8,8,8,0.95); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); padding: 0 40px; height: 64px; display: flex; align-items: center; justify-content: space-between; }
        .nav-brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
        .nav-brand-text { font-family: 'Playfair Display', serif; font-size: 22px; color: var(--gold); font-weight: 700; }
        .nav-links { display: flex; gap: 4px; }
        .nav-link { color: var(--text-muted); text-decoration: none; padding: 7px 14px; border-radius: 8px; font-size: 14px; font-weight: 500; transition: color 0.2s, background 0.2s; }
        .nav-link:hover { color: var(--gold); background: var(--gold-dim); }
        .btn-logout { background: transparent; border: 1px solid rgba(220,53,69,0.4); color: #e07070; border-radius: 8px; padding: 7px 16px; font-family: 'DM Sans', sans-serif; font-size: 13px; cursor: pointer; transition: all 0.2s; }
        .btn-logout:hover { background: rgba(220,53,69,0.15); }
        .main { padding: 48px 40px; max-width: 600px; margin: 0 auto; }
        .breadcrumb { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-muted); margin-bottom: 28px; }
        .breadcrumb a { color: var(--text-muted); text-decoration: none; }
        .breadcrumb a:hover { color: var(--gold); }
        .page-title { font-family: 'Playfair Display', serif; font-size: 32px; margin-bottom: 32px; }
        .page-title span { color: var(--gold); }
        .form-card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 40px; position: relative; overflow: hidden; }
        .form-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, var(--gold), transparent); }
        .form-group { margin-bottom: 24px; }
        label { display: block; font-size: 12px; font-weight: 500; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 9px; }
        input { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 13px 16px; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 15px; transition: border-color 0.2s, box-shadow 0.2s; outline: none; }
        input:focus { border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-dim); }
        input::placeholder { color: #3a3530; }
        .actions { display: flex; gap: 12px; margin-top: 8px; }
        .btn-primary { flex: 1; background: var(--gold); color: #080808; border: none; border-radius: 10px; padding: 14px 24px; font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .btn-primary:hover { background: var(--gold-light); transform: translateY(-1px); }
        .btn-secondary { background: transparent; border: 1px solid var(--border); color: var(--text-muted); border-radius: 10px; padding: 14px 24px; text-decoration: none; font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 500; transition: all 0.2s; display: flex; align-items: center; }
        .btn-secondary:hover { border-color: var(--gold); color: var(--gold); }
        .input-prefix { position: relative; }
        .prefix-symbol { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 16px; pointer-events: none; }
        .input-prefix input { padding-left: 30px; }
    </style>
</head>
<body>
<nav class="navbar">
    <a href="/dashboard" class="nav-brand"><span>💈</span><span class="nav-brand-text">BarberManager</span></a>
    <div class="nav-links">
        <a href="/dashboard" class="nav-link">Dashboard</a>
        <a href="/clientes" class="nav-link">Clientes</a>
        <a href="/barberos" class="nav-link">Barberos</a>
        <a href="/servicios" class="nav-link active">Servicios</a>
        <a href="/citas" class="nav-link">Citas</a>
    </div>
    <form action="/logout" method="post" style="margin:0;"><button type="submit" class="btn-logout">Cerrar Sesión</button></form>
</nav>
<div class="main">
    <div class="breadcrumb"><a href="/dashboard">Dashboard</a><span>/</span><a href="/servicios">Servicios</a><span>/</span><span>Nuevo</span></div>
    <div class="page-title">🛎️ Nuevo <span>Servicio</span></div>
    <div class="form-card">
        <form th:action="@{/servicios/guardar}" th:object="${servicio}" method="post">
            <div class="form-group"><label>Nombre del servicio</label><input type="text" th:field="*{nombre}" placeholder="Ej: Corte clásico, Degradado, Barba..." required></div>
            <div class="form-group">
                <label>Precio</label>
                <div class="input-prefix">
                    <span class="prefix-symbol">$</span>
                    <input type="number" step="0.01" min="0" th:field="*{precio}" placeholder="0.00" required>
                </div>
            </div>
            <div class="actions">
                <a href="/servicios" class="btn-secondary">← Cancelar</a>
                <button type="submit" class="btn-primary">Guardar Servicio</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
