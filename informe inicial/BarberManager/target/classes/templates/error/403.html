<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Denegado — BarberManager</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root { --gold: #C9A84C; --bg: #080808; --surface: #111111; --text: #F0EAD6; --text-muted: #7a7060; --border: rgba(201,168,76,0.18); }
        body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .box { text-align: center; padding: 60px 40px; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; max-width: 420px; }
        .code { font-family: 'Playfair Display', serif; font-size: 80px; color: var(--gold); font-weight: 900; line-height: 1; }
        h2 { font-size: 22px; margin: 16px 0 10px; }
        p { color: var(--text-muted); font-size: 14px; line-height: 1.6; margin-bottom: 28px; }
        .btn { display: inline-block; background: var(--gold); color: #080808; padding: 12px 28px; border-radius: 10px; text-decoration: none; font-weight: 600; font-size: 14px; }
    </style>
</head>
<body>
<div class="box">
    <div class="code">403</div>
    <h2>Acceso denegado</h2>
    <p>No tienes permisos para acceder a esta sección. Solo los administradores pueden ingresar aquí.</p>
    <a href="/dashboard" class="btn">Volver al Dashboard</a>
</div>
</body>
</html>
